# Mod metadata. The placeholders below are filled in by processResources from gradle.properties.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# This mod is purely client-side: Forge skips loading it on dedicated servers and uses
# IGNORE_ALL_VERSION as the display test, so servers don't need it installed.
clientSideOnly=true

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
